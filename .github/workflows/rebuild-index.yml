# Rebuild the launcher's mod catalog (index.json) after a release.
#
# index.json lists the latest released .kmod per user-facing mod so the
# Kestrel launcher can browse and install from this repo instead of
# Horizon's registry. The three probes are excluded by tools/build_index.py.
# The file is unsigned (SHA-256-pinned only); no secret is involved.
# Rebuilding never creates a release and never touches the mods themselves.
name: Rebuild mod index

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/build_index.py
      - name: Commit updated index.json
        run: |
          git config user.name "NepThunder"
          git config user.email "84651805+NepThunder@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json unchanged, nothing to commit"
          else
            git commit -m "Rebuild mod index"
            # Release events check out the tag (detached HEAD), so a bare
            # `git push` has no upstream branch — push the commit to main
            # explicitly. Manual dispatch checks out main and works either way.
            git push origin HEAD:main
          fi
