# World Map: in a fixtured world the mod accumulates the
# game's tiles, puts its minimap up (128 in the top-right
# corner by default), and the /wp suite answers: add at the
# player's position, list, rename, clear. The shading,
# codec, group and format maths are covered by the unit
# tests in src/lib.rs; the harness cannot press M, N or Z,
# so the screens ride on those unit tests.

[[step]]
map-context = { dimension = "minecraft:overworld", world = "Probe World" }
tiles = [
  { cx = 0, cz = 0, colors = [7, 7, 7, 7] },
  { cx = 1, cz = 0, colors = [3, 3] },
]
ticks = 12
[step.expect]
chat = []
minimap-image = "top-right 128 128x128"
map-screen = "none"

[[step]]
command = "wp add Base Camp"
[step.expect]
feedback = "World Map: added 'Base Camp' at 0, 64, 0"

[[step]]
command = "wp list"
[step.expect]
feedback = "1. Base Camp (0, 64, 0) — 0m"

[[step]]
command = "wp rename Base Camp | Home"
[step.expect]
feedback = "World Map: 'Base Camp' is now 'Home'"

[[step]]
command = "wp clear"
[step.expect]
feedback = "World Map: cleared 1 waypoints here"
