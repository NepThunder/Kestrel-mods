# FreeCam (Yannis_): F4 (or /freecam_yannis) starts the free
# camera at the player's eye; F4 again ends it. The player stands
# at 0.5 64 0.5 facing south (+z), so the eye is 0.5 65.6 0.5,
# yaw 0, pitch 0. The toggles answer in chat only.
#
# The script harness cannot press F4/F6 or the number keys, so
# the follow view and the tripod save/recall are covered by the
# unit tests in src/lib.rs (the tripod encoding, the per-world
# keys, the follow hover maths); what this script proves is the
# toggle itself through /freecam_yannis, the camera call behind
# it (the feedback carries the effective pose), and the release
# on leaving the world.

[[step]]
ticks = 1
[step.expect]
commands = ["freecam_yannis"]
chat = []
panel = []

[[step]]
command = "freecam_yannis"
[step.expect]
feedback = "FreeCam on — camera x=0.5 y=65.6 z=0.5 yaw=0.0 pitch=0.0"
panel = []

[[step]]
ticks = 1
[step.expect]
panel = []

[[step]]
command = "freecam_yannis"
[step.expect]
feedback = "FreeCam off — camera x=0.5 y=65.6 z=0.5 yaw=0.0 pitch=0.0"
panel = []

[[step]]
command = "freecam_yannis"
[step.expect]
feedback = "FreeCam on — camera x=0.5 y=65.6 z=0.5 yaw=0.0 pitch=0.0"
panel = []

[[step]]
title-screen = true
ticks = 1
[step.expect]
panel = []
