id = "context_tools"
name = "Context Tool Swap"
version = "0.2.0"
description = "A behaviour port of Context Tool Swap (MIT) by TTCjonasTTC and Qwen (https://github.com/TTCjonasTTC/context_toolswap). Ported for Kestrel by NepThunder. Press middle click with a tool in hand, looking at a block — or simply start breaking a block — and the right tool for it is swapped out of your inventory into your hand: the best one you carry, correct for the block's drops first, then fastest, as the original picks — from the hotbar by selecting it, from your bag with one swap click that trades it with the stack in your selected slot (SDK API 24). /toolswap turns it on or off (on by default), as in the original. Still partial in one rule: the original skips creative and spectator, which a client mod cannot detect (the SDK shows no game mode); and the middle click keeps its vanilla pick-block as well, because a registered key does not consume the button. This port's home is https://github.com/NepThunder/Kestrel-mods/tree/main/mods/context_tools"
authors = ["NepThunder"]
api = "0.1"
side = "client"
capabilities = ["input", "inventory", "actions", "inventory-actions", "storage"]
experimental = ["input", "inventory", "actions", "inventory-actions"]
