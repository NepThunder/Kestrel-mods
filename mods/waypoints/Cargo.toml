[package]
name = "waypoints"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Waypoints for Kestrel: N creates one where you stand, M lists them, and visible ones show a box and a beam in the world, their name and distance on the HUD, and an in-world label with their name and distance at their position. A behaviour port of Waypoints by Nirokx."

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { path = "../.." }

[lints]
workspace = true
