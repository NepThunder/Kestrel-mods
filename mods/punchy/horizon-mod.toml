id = "punchy"
name = "Punchy"
version = "0.1.0"
description = "A behaviour port of Punchy! by PunchyDevGuy (All Rights Reserved; no code or assets copied — the feel reimplemented against the Kestrel SDK, API 16). The first-person hand lags behind your look on a spring, follows through on your attacks, and bobs with more weight. Options > Mods > Punchy sets the intensity and which parts run, and /punchy reports them. First-person only in v1; the original's resource pack and third-person changes are out of scope. This port's home is https://github.com/NepThunder/Kestrel-mods/tree/main/mods/punchy"
authors = ["NepThunder"]
api = "0.1"
side = "client"
capabilities = ["game-read", "render", "storage", "ui"]
experimental = ["render", "ui"]
