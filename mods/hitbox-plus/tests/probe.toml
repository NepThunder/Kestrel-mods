# Hitbox+: a green box, red eye band and blue look arrow round the mob
# under the crosshair within reach, and a cyan box, band and arrow round
# the mob beside it. The player stands at 0.5 64 0.5 facing south (+z).
#
# The zombie stands 2 blocks ahead, inside the 3-block melee reach, so
# it is the target: its box is bright green (4278249078). The cow stands
# off to the side, yaw 90 (facing west), so it is not targeted: its box
# is the default Neon Cyan (4278248959). Both are 2 blocks tall, so their
# eye bands sit at 65.7 (64 + 0.85 * 2.0); the bands are red
# (4294901760) and the arrows blue (4278190335), all 2.5 wide (the
# default Normal thickness). All coordinates are exact in binary, so the
# expected lines compare exactly.
#
# The script harness cannot press keys or hold the sprint mapping, so
# the H toggle and the sprint indicator are covered by the unit tests in
# src/lib.rs; what this script does prove is the drawing itself, the
# /hitbox toggle answering, the choice surviving a reload, the
# multiplayer target-only split, and leaving the world clearing the
# shapes.

[[step]]
ticks = 1
[[step.entities]]
id = 1
kind = "minecraft:zombie"
name = "Zombie"
x = 0.5
y = 64.0
z = 2.5
health = 20.0
max-health = 20.0
width = 0.5
height = 2.0
[[step.entities]]
id = 2
kind = "minecraft:cow"
name = "Cow"
x = 3.5
y = 64.0
z = 8.5
health = 10.0
max-health = 10.0
width = 1.0
height = 2.0
yaw = 90.0
[step.expect]
