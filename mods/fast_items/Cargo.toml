[package]
name = "fast_items"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Fast Items for Kestrel: dropped flat items lie as one camera-facing sprite and dropped block items face the camera instead of spinning. A behaviour port of Fast Items for Horizon by Lyvt, inspired by Noryea's Fast Items."

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { path = "../.." }

[lints]
workspace = true
