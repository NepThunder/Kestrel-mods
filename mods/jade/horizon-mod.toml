id = "jade"
name = "Jade"
version = "0.2.0"
description = "A port of Jade by Snownee and Joeypc6 (block and entity identification). Ported for Kestrel by NepThunder. Look at a block or a mob to see what it is — a block's name, its mod, its position and how far away it is, or a mob's name, its kind, its health and how far away it is — in a panel at the top-left; /jade hides or shows it, and Options > Mods has the same switch. This port's home is https://github.com/NepThunder/Kestrel-mods/tree/main/mods/jade"
authors = ["NepThunder"]
api = "0.1"
side = "client"
capabilities = ["game-read", "hud", "recipes", "chat", "storage", "ui", "entity"]
experimental = ["recipes", "ui", "entity"]
