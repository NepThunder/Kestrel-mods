[package]
name = "keystrokes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Keystrokes for Kestrel: movement keys, mouse buttons and space bar lit while held, with clicks per second. A port of Horizon's own Keystrokes (MIT), formerly a built-in extra."

[lib]
