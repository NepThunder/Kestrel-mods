# Freecam: Y (or /freecam) detaches the camera at the player's eye,
# looking where they look; toggling again releases it back to the
# player. The player stands at 0.5 64 0.5 facing south (+z), so the
# eye is 0.5 65.6 0.5, yaw 0, pitch 0. There is no HUD notice: the
# toggle answers in chat only ("Freecam on" / "Freecam off").
#
# The script harness cannot press keys or hold them, so the Y toggle
# and the six fly keys are covered by the unit tests in src/lib.rs
# (the held-key state machine and the fly math) and by the sandbox
# load test's key path; what this script does prove is the toggle
# itself through /freecam, the camera call behind it (the feedback
# carries the effective pose, as the camera probe's does), and the
# release on reload, and leaving the world. Movement while detached
# is unit-tested only: a tick with no movement key held leaves the
# camera exactly where it was.

[[step]]
ticks = 1
[step.expect]
commands = ["freecam"]
chat = []
panel = []

# Toggle on: the camera detaches at the player's eye. No HUD
# panel appears — the toggle answers in chat only.
[[step]]
command = "freecam"
[step.expect]
feedback = "Freecam on — camera x=0.5 y=65.6 z=0.5 yaw=0.0 pitch=0.0"
panel = []

# A tick with no movement key held: the camera stays where it was.
[[step]]
ticks = 1
[step.expect]
panel = []

# Toggle off: the camera is the player's own again.
[[step]]
command = "freecam"
[step.expect]
feedback = "Freecam off — camera x=0.5 y=65.6 z=0.5 yaw=0.0 pitch=0.0"
panel = []

# On again, then a reload: unloading the mod releases its camera,
# so the camera is the player's own.
[[step]]
command = "freecam"
[step.expect]
feedback = "Freecam on — camera x=0.5 y=65.6 z=0.5 yaw=0.0 pitch=0.0"
panel = []

[[step]]
reload = true
ticks = 1
[step.expect]
panel = []

[[step]]
command = "freecam"
[step.expect]
feedback = "Freecam on — camera x=0.5 y=65.6 z=0.5 yaw=0.0 pitch=0.0"
panel = []

# Leaving the world releases the camera.
[[step]]
title-screen = true
ticks = 1
[step.expect]
panel = []
