id = "inventory_wizard"
name = "Inventory Wizard"
version = "0.1.0"
description = "A behaviour port of InventoryWizard by VanishingTacos (https://github.com/VanishingTacos/InventoryWizard), MIT, version 2.3.3. Ported for Kestrel by NepThunder. Smart sorting: items are sorted by category — stone, earth, wood, ores, blocks, tools, weapons, armor, food, redstone, transportation, decoration — worked out from item tags and components, and the hotbar is laid out survival-style: weapons, tools, food, building blocks, utility items, then the rest. Partial stacks merge, but enchanted or named items are never combined. Three sort modes — Default, Alphabetical, Stack-based — with sort buttons and a mode button (it shows the mode's letter) beside the inventory and container titles, the R key, and the /iwiz [hotbar|inventory|all|mode] command (also /inventorywizard). Slots can be locked so sorting never touches them, and locked slots survive restarts. Works on the inventory, hotbar, chests, barrels, shulker boxes and ender chests, in singleplayer and on servers; every sort is ordinary left clicks. Three differences from the original, all limits of the surface: Alt+Click locking and Shift+Right-Click sorting observe ordinary slot clicks, which no SDK surface reports, so locks live on the mod's page in Options > Mods instead (pick a slot, flip Locked) and the sort gestures are the buttons, the R key and the command; the R key and the command fire only while playing with no screen open, so in a screen the buttons carry the sorts, and R sorts the whole inventory rather than the part under the cursor; and the mode key ships unbound, as the original's does. The category a item lands in is judged from its tags and id — the game's own item data, not a creative-tab read. This port's home is https://github.com/NepThunder/Kestrel-mods/tree/main/mods/inventory_wizard"
authors = ["NepThunder"]
api = "0.1"
side = "client"
capabilities = ["command", "input", "inventory", "inventory-actions", "recipes", "screen", "storage", "ui"]
experimental = ["input", "inventory", "inventory-actions", "recipes", "screen", "ui"]
