[package]
name = "light-overlay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Light Overlay for Kestrel: colour-coded crosses on the block tops where hostile mobs can spawn — red where they can spawn any time, yellow where they can spawn at night. A behaviour port of Light Overlay by CayMac."

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { path = "../.." }

[lints]
workspace = true
