id = "compass_bar"
name = "Compass Bar"
version = "0.1.0"
description = "A behaviour port of Compass Enhanced by Isaac (Fernandes585), MIT (https://github.com/Fernandes585/Compass-Enhanced). Ported for Kestrel by NepThunder. A compass bar across the top of the screen: the eight compass letters (N, NE, E, SE, S, SW, W, NW) in one colour and a degree scale, sliding smoothly as you turn. Options > Mods > Compass Bar holds the original's settings: the bar on/off, the background box, the size (75% to 150%) and the letter colour. The original's death points are NOT included: the client SDK exposes no death event, so there is nothing to hang a death marker on yet — they arrive when the SDK gains one, and the death-point settings go with them. This port's home is https://github.com/NepThunder/Kestrel-mods/tree/main/mods/compass_bar"
authors = ["NepThunder"]
api = "0.1"
side = "client"
capabilities = ["game-read", "render", "storage", "ui"]
experimental = ["render", "ui"]
