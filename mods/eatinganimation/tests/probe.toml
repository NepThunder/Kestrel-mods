# Eating Animation: at load the mod declares its one rule per
# covered item — all 43, in the table's order, hand contexts
# only. The frames themselves are resolver work against the
# package's content definitions, which the unit tests in
# src/lib.rs pin against the same table.

[[step]]
ticks = 1
[step.expect]
