id = "right_click_crops"
name = "Right-Click Crops"
version = "0.1.0"
description = "A behaviour port of Right-Click Crops (MIT) by AyanoKaito (https://github.com/AyanoKaito/horizon-right-click-crops). Ported for Kestrel by NepThunder. Right-click a mature plant to harvest it with the game's own loot and replant it for one matching planting item — from the harvest itself first, then your inventory: wheat, carrots, potatoes, beetroot, nether wart, cocoa, torchflower and pitcher crop are replanted; sugar cane, cactus, bamboo, kelp and the vines keep their base or anchor; pumpkin and melon keep their attached stem. Each of the sixteen families can be switched off in Options > Mods > Right-Click Crops. The click is left alone when bone meal is in either hand, when you crouch holding an item, and when you use shears on a pumpkin; sweet and glow berries are never touched. Differences from the original, all limits of the client SDK: payment can only come from your hand, your hotbar or your offhand — a planting item deeper in the bag cannot be moved to your hand yet, so the crop is then harvested without replanting; the survival-only gate cannot be applied because the SDK shows a client mod no game mode; and the tall plants, the torchflower's farmland check and the pumpkin/melon stem check read the world's blocks, which the SDK lends to client mods in single player only, so on a server those families wait (the soil crops still harvest and replant there). This port's home is https://github.com/NepThunder/Kestrel-mods/tree/main/mods/right_click_crops"
authors = ["NepThunder"]
api = "0.1"
side = "client"
capabilities = ["game-read", "input", "world", "inventory", "actions", "storage", "ui"]
experimental = ["input", "inventory", "actions", "ui"]
